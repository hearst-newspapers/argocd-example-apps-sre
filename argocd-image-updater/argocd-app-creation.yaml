# This is the yaml used to create the argocd-image-updater app
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  source:
    repoURL: https://argoproj.github.io/argo-helm
    targetRevision: 1.1.0
    chart: argocd-image-updater
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      targetRevision: 1.1.0
      chart: argocd-image-updater
      helm:
        valueFiles:
        - values.yaml
        - $values/argocd-image-updater/values.yaml
    - repoURL: git@github.com:hearst-newspapers/argocd-example-apps-sre.git
      ref: values
      targetRevision: HEAD
      directory:
        jsonnet:
  project: default

