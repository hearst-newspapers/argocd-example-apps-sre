apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: devops-infra-updater
  namespace: argocd
spec:
  namespace: argocd
  applicationRefs:
    - namePattern: "redirect-test"
      images:
        - alias: "devops-infra"
          imageName: "236910733144.dkr.ecr.us-west-2.amazonaws.com/hearst-newspapers/devops-infra:latest-3"
          commonUpdateSettings:
            updateStrategy: "digest"
            #updateStrategy: "newest-build"
	  manifestTargets:
	    helm:
	      name: "image.repository"
	      tag: "image.tag"
